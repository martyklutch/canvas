<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Sign Up</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <!-- My Logo -->
        <div class="logo">
            <a href="index.html">Canvas</a>
        </div>

        <!-- Search Form -->

        <div class= "searchBar">
            <input class="search-input" type="text" name="search" placeholder="Search The Grid...">
        </div>

        <!-- Navigation Menu -->
        <nav class="main-nav">
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="#">Explore</a></li>
                <li><a href="#">Fresh</a></li>
                <li><a href="#">Projects</a></li> 
            </ul>
        </nav>

        <div class="auth-btns">
            <a href="../login/index.html" class="btn-login">Login</a>
            <a href="../signup/index.html" class="btn-signup">Sign Up</a>

        </div>

    </header>

    <main>
        <!-- Sign up form -->
            <div class="signup-container">
                <h2>Join Canvas</h2>
                    <p>Sign up to discover and share amazing content on The Grid.</p>
                        <form class="signup-form">
                            <input type="text" name="username" placeholder="Username" required>
                            <input type="email" name="email" placeholder="Email" required>
                            <input type="password" name="password" placeholder="Password" required>
                            <input type="date" name="birthday" id="signup-birthday" placeholder="mm/dd/yyyy birthday" required>
                            <button type="submit">Sign Up</button>
                        </form>

                        <p class="login-link">Already have an account? <a href="../login/index.html">Log in here</a></p>
            </div>
    </main>
</body>


</html>
