<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="detail-view">
    <header>
        <!-- My Logo -->
        <div class="logo">
            <a href="index.html">Canvas</a>
        </div>

        <!-- Search Form -->

        <div class= "searchBar">
            <input class="search-input" type="text" name="search" placeholder="Search The Grid...">
        </div>

        <!-- Navigation Menu -->
        <nav class="main-nav">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Explore</a></li>
                <li><a href="#">Fresh</a></li>
                <li><a href="#">Projects</a></li> 
            </ul>
        </nav>

        <div class="auth-btns">
            <a href="login/index.html" class="btn-login">Login</a>
            <a href="signup/index.html" class="btn-signup">Sign Up</a>

        </div>

    </header>

    <main>
        <!-- Filter Options -->
        <div class="filter-options">
            <button class="filter-btn" data-filter="landscapes">landscapes</button>
            <button class="filter-btn" data-filter="art">Art</button>
            <button class="filter-btn" data-filter="design">Design</button>
            <button class="filter-btn" data-filter="photography">Photography</button>
            <button class="filter-btn" data-filter="technology">Technology</button>
            <button class="filter-btn" data-filter="fashion">Fashion</button>
        </div>

        <!-- Grid Container -->

        <div class="grid" id="feed">

            <!-- Cards will be injected here by the script-->

        </div>

    </main>

    <script src="js/app.js"> </script>

</body>
</html>
